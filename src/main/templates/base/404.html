<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Não Encontrada - Blog</title>
    <!-- Twind Setup for Tailwind CSS in JS -->
    <script src="https://cdn.twind.style"></script>
    <script>
      twind.install({
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              gray: twind.colors.trueGray,
            }
          }
        }
      });
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" />
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-2xl p-8 text-center shadow-2xl">
        <div class="text-indigo-500 flex justify-center mb-6 text-5xl">
            <i class="fas fa-ghost"></i>
        </div>

        <h1 class="text-3xl font-extrabold text-white mb-2">404</h1>
        <h2 class="text-lg font-semibold text-gray-300 mb-3">Página ou Publicação não encontrada</h2>
        <p class="text-sm text-gray-400 mb-8">
            O artigo solicitado pode ter sido excluído, estar em modo rascunho privado ou o link digitado está incorreto.
        </p>

        <a href="{% url 'main:home' %}" class="inline-flex items-center justify-center gap-2 w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition-all shadow-sm">
            <i class="fas fa-arrow-left"></i> Voltar para o Feed Principal
        </a>
    </div>

</body>
</html>
